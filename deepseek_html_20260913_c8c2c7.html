/* HOME */
#home{position:absolute;inset:0;background:#000}
#home-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#home-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;z-index:2;pointer-events:none;padding:20px}
#home-title{font-size:8rem;letter-spacing:12px;color:#c77dff;text-shadow:0 0 30px #7b2cbf,0 0 70px #7b2cbf;user-select:none;pointer-events:none}
#search-wrap{display:flex;gap:10px;width:min(720px,90vw);pointer-events:auto}

#search-go{padding:14px 30px;font-family:'Times New Roman',Times,serif;font-size:1.05rem;color:#fff;background:#7b2cbf;border:2px solid #7b2cbf;border-radius:8px;cursor:pointer;transition:all .25s ease}
#search-go:hover{background:#c77dff;border-color:#c77dff;box-shadow:0 0 22px rgba(123,44,191,.9)}

/* GAME SEARCH TABS */
#home-games{position:absolute;bottom:0;left:0;right:0;z-index:3;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(10,10,15,0.92) 60%,rgba(10,10,15,1) 100%);padding:26px 20px 20px 20px;display:flex;flex-direction:column;gap:10px}

#home-games-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:900px;margin:0 auto}
.game-tab{padding:10px 18px;font-family:'Times New Roman',Times,serif;font-size:.95rem;color:#c77dff;background:rgba(13,13,26,.85);border:2px solid #7b2cbf;border-radius:22px;cursor:pointer;user-select:none;transition:all .2s ease;white-space:nowrap}
.game-tab:hover{background:#7b2cbf;color:#fff;box-shadow:0 0 18px rgba(123,44,191,.9);transform:translateY(-2px)}
.game-tab:active{transform:translateY(0)}

/* VIEWER */
#viewer{position:fixed;inset:0;background:#000;z-index:500;display:none}
#viewer.visible{display:block}
#viewer-frame{position:absolute;inset:0;width:100%;height:100%;border:none;background:#000}
#viewer-controls{position:fixed;top:12px;right:12px;display:flex;gap:10px;z-index:510}
.ctrl-btn{padding:10px 22px;font-family:'Times New Roman',Times,serif;font-size:.95rem;color:#c77dff;background:rgba(13,13,26,.92);border:2px solid #7b2cbf;border-radius:6px;cursor:pointer;transition:all .25s ease}
.ctrl-btn:hover{background:#7b2cbf;color:#fff;box-shadow:0 0 18px rgba(123,44,191,.9)}
.spinner{width:42px;height:42px;border:4px solid rgba(123,44,191,.25);border-top-color:#c77dff;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-box{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#000;color:#c77dff;font-family:'Times New Roman',Times,serif;font-size:1.1rem;z-index:1;text-align:center;padding:20px}
.loading-box .sub{font-size:.85rem;opacity:.75;margin-top:6px}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:#0a0a0f}
::-webkit-scrollbar-thumb{background:#7b2cbf;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#c77dff}
</style>
</head>
<body>

<div id="launcher"><button id="launch-btn" type="button">Launch Schoology</button></div>

<div id="app">

</div>
</div>
<div id="home-games">

</div>

<!DOCTYPE html>
<html>
<head>

<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{max-width:100%}</style>
<script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.7/build/dat.gui.min.js"></script>

<body>
<canvas id="myCanvas"></canvas>
<script>
let count=0,bgColor="black",updateFPS=30,ww,wh;
const controls={showId:true,showMap:false};
try{const gui=new dat.GUI();gui.add(controls,"showId");gui.add(controls,"showMap")}catch(e){}
class Vec2{constructor(x,y){this.x=x||0;this.y=y||0}set(x,y){this.x=x;this.y=y}move(x,y){this.x+=x;this.y+=y}add(v){return new Vec2(this.x+v.x,this.y+v.y)}sub(v){return new Vec2(this.x-v.x,this.y-v.y)}mul(n){return new Vec2(this.x*n,this.y*n)}get length(){return Math.sqrt(this.x*this.x+this.y*this.y)}set length(v){let t=this.unit.mul(v);this.set(t.x,t.y)}clone(){return new Vec2(this.x,this.y)}get angle(){return Math.atan2(this.y,this.x)}get unit(){return this.mul(1/this.length)}}
const canvas=document.querySelector("#myCanvas"),ctx=canvas.getContext("2d");
ctx.circle=function(v,r){this.arc(v.x,v.y,r,0,Math.PI*2)};
ctx.line=function(a,b){this.moveTo(a.x,a.y);this.lineTo(b.x,b.y)};
let global={scale:1,width:4000,height:4000,foodmax:500,playermax:50,collideFactor:0};
function map(v,a,b,c,d){return (v-a)*((d-c)/(b-a))+c}
class Player{constructor(a){a=a||{};this.id=a.id||parseInt(Math.random()*1000000);this.p=a.p||new Vec2();this.v=a.v||new Vec2(map(Math.random(),0,1,-5,5),map(Math.random(),0,1,-5,5));this.a=a.a||new Vec2();this.mass=a.mass||100;this.living=true;this.color=a.color||('hsl('+(Math.random()*360)+',60%,50%)');if(a.type)this.type=a.type}
draw(){ctx.fillStyle=this.color;ctx.beginPath();ctx.circle(this.p,this.r);ctx.fill();if(this.type!=="food"&&controls.showId){ctx.font="10px Arial";ctx.fillStyle="#fff";ctx.textAlign="center";ctx.fillText(parseInt(this.id),this.p.x,this.p.y)}}
update(){this.p.move(this.v.x,this.v.y);this.v.move(this.a.x,this.a.y);this.a=this.a.mul(0.98);if(this.mass<0)this.living=false;if(this.type==="food"){this.v.x*=0.95;this.v.y*=0.95}this.checkBoundary()}
checkBoundary(){if(this.p.x-this.r<-global.width/2)this.p.x=-global.width/2+this.r;if(this.p.x+this.r>global.width/2)this.p.x=global.width/2-this.r;if(this.p.y-this.r<-global.height/2)this.p.y=-global.height/2+this.r;if(this.p.y+this.r>global.height/2)this.p.y=global.height/2-this.r}
eat(t){gsap.to(this,0.1,{mass:this.mass+t.mass});t.living=false}
isTarget(t){return t.r<this.r*0.9&&t.p.sub(this.p).length<500}
get r(){return Math.sqrt(this.mass)}
get maxSpeed(){return 35/(1+Math.log(this.r))}}
function initCanvas(){ww=canvas.width=window.innerWidth;wh=canvas.height=window.innerHeight}
initCanvas();
let players=[],myPlayers=[],canvasCenter=new Vec2(ww/2,wh/2);
function init(){for(let i=0;i<300;i++)players.push(new Player({mass:Math.random()*1000+24,p:new Vec2(map(Math.random(),0,1,-global.width/2,global.width/2),map(Math.random(),0,1,-global.height/2,global.height/2))}));myPlayers.push(players[0])}
function scaleAnimation(){if(!myPlayers[0])return;let s=1/Math.log(Math.sqrt(myPlayers[0].r/4+2.4));gsap.to(global,2,{scale:s})}
function addFoodOrPlayer(){let fc=0,pc=0;for(let i=0;i<players.length;i++){if(players[i].type==="food")fc++;else pc++}if(fc<global.foodmax)players.push(new Player({mass:10,p:new Vec2(map(Math.random(),0,1,-global.width/2,global.width/2),map(Math.random(),0,1,-global.height/2,global.height/2)),v:new Vec2(),type:"food"}));if(pc<global.playermax)players.push(new Player({mass:Math.random()*1000+24,p:new Vec2(map(Math.random(),0,1,-global.width/2,global.width/2),map(Math.random(),0,1,-global.height/2,global.height/2))}))}
function update(){let mp=myPlayers[0];if(!mp)return;players.forEach((p,pid)=>{if(!p.living)return;p.update();if((count+pid*5)%60===0&&p.id!==mp.id&&p.type!=="food"){if(Math.random()<0.2){let an=Math.PI*2*Math.random();gsap.to(p.v,0.1,{x:p.maxSpeed*Math.cos(an),y:p.maxSpeed*Math.sin(an)})}}players.forEach((p2,pid2)=>{if(pid===pid2||p.id===p2.id||!p2.living)return;if(p.r*0.9>p2.r&&p.p.sub(p2.p).length-10<=p.r-p2.r)p.eat(p2)})});let d=mousePosition.sub(canvasCenter).mul(0.1);mp.v=d.length>mp.maxSpeed?d.unit.mul(mp.maxSpeed):d;players=players.filter(p=>p.living);myPlayers=myPlayers.filter(p=>p.living);if(myPlayers.length===0){let alive=players.filter(p=>p.type!=="food");if(alive.length>0)myPlayers.push(alive[0])}}
function draw(){count++;ctx.fillStyle=bgColor;ctx.fillRect(0,0,ww,wh);if(!myPlayers[0]){requestAnimationFrame(draw);return}let c=myPlayers[0].p;ctx.save();ctx.translate(ww/2,wh/2);ctx.scale(global.scale,global.scale);ctx.translate(-c.x,-c.y);let gw=250,gc=global.width/gw;for(let i=-gc/2;i<=gc/2;i++){ctx.moveTo(i*gw,-global.height/2);ctx.lineTo(i*gw,global.height/2);ctx.moveTo(-global.width/2,i*gw);ctx.lineTo(global.width/2,i*gw)}ctx.strokeStyle='hsl(0 0% 100% / 0.4)';ctx.stroke();let s=players.slice().sort((a,b)=>a.r-b.r);for(let i=0;i<s.length;i++)if(s[i].living)s[i].draw();ctx.restore();ctx.font="20px Arial";ctx.fillStyle="#eee";let sc=0;for(let i=0;i<myPlayers.length;i++)sc+=myPlayers[i].mass;ctx.fillText("Score: "+parseInt(sc),24,26);ctx.fillStyle="red";ctx.beginPath();ctx.circle(mousePosition,3);ctx.fill();requestAnimationFrame(draw);if(count%(60/updateFPS)===0)requestAnimationFrame(update);if(count%120===0)requestAnimationFrame(scaleAnimation);requestAnimationFrame(addFoodOrPlayer)}
let mousePosition=new Vec2(0,0);
window.addEventListener("mousemove",function(e){mousePosition.set(e.x,e.y)});
window.addEventListener("mouseup",function(e){mousePosition.set(e.x,e.y)});
window.addEventListener("mousedown",function(e){mousePosition.set(e.x,e.y)});
window.addEventListener("resize",initCanvas);
window.addEventListener("load",function(){initCanvas();init();requestAnimationFrame(draw)});
window.addEventListener("keydown",function(e){if(e.key==" "){let nb=[];global.collideFactor=1;if(global.spiltTimer)clearTimeout(global.spiltTimer);gsap.killTweensOf(global);global.spiltTimer=setTimeout(function(){gsap.to(global,10,{collideFactor:0})},8000);myPlayers.forEach(function(mp){if(mp.mass>400&&myPlayers.length<24){gsap.to(mp,0.2,{mass:mp.mass/2});nb.push(new Player({id:mp.id,mass:mp.mass/2,p:mp.p.clone(),v:mousePosition.sub(canvasCenter).unit.mul(mp.maxSpeed*2),a:mousePosition.sub(canvasCenter).unit.mul(mp.maxSpeed*2),color:mp.color}))}});players=players.concat(nb);myPlayers=myPlayers.concat(nb)}});
</script>
</body>
</html>

    var child=null;
    try{child=window.open('about:blank','_blank')}catch(e){child=null}
    if(!child||child.closed||typeof child.closed==='undefined'){showAppHere();return}
    try{child.document.open();child.document.write(childHtml);child.document.close()}catch(e){showAppHere();return}
    setTimeout(function(){try{startHeartbeat(child)}catch(e){}},800);
    setTimeout(function(){try{window.close()}catch(e){}},600);
}
function showAppHere(){launcher.style.display='none';app.classList.add('visible');startHeartbeat(window)}
function startHeartbeat(win){
    if(!win||win.closed||win.__nexusHB)return;
    win.__nexusHB=true;
    try{
        var code='var t;self.onmessage=function(e){if(e.data==="start"){t=setInterval(function(){self.postMessage(1)},1000)}else if(e.data==="stop"){clearInterval(t)}};';
        var blob=new Blob([code],{type:'application/javascript'});
        var w=new Worker(URL.createObjectURL(blob));
        w.onmessage=function(){try{if(win&&!win.closed&&win.document)win.document.documentElement.setAttribute('data-hb',String(Date.now()))}catch(e){}};
        w.postMessage('start');
        win.__nexusWorker=w;
    }catch(e){}
    try{win.__nexusInterval=setInterval(function(){try{if(win&&!win.closed&&win.document)win.document.documentElement.setAttribute('data-hb',String(Date.now()))}catch(e){}},5000)}catch(e){}
}

var homeCtx=null,homeStars=[],homeAnimId=null,homeW=0,homeH=0;
function resizeHomeCanvas(){
    if(!homeCanvas)return;
    var r=homeCanvas.getBoundingClientRect();
    var dpr=window.devicePixelRatio||1;
    homeW=r.width||window.innerWidth;homeH=r.height||window.innerHeight;
    homeCanvas.width=Math.floor(homeW*dpr);homeCanvas.height=Math.floor(homeH*dpr);
    if(homeCtx)homeCtx.setTransform(dpr,0,0,dpr,0,0);
    buildStars();
}
function buildStars(){homeStars=[];var c=Math.max(60,Math.floor(homeW*homeH/5000));for(var i=0;i<c;i++)homeStars.push({x:Math.random()*homeW,y:Math.random()*homeH,z:Math.random()*2+0.4,r:Math.random()*1.4+0.3,v:Math.random()*0.35+0.08})}
function drawStars(){
    if(!homeCtx)return;
    homeCtx.fillStyle='rgba(0,0,0,0.28)';homeCtx.fillRect(0,0,homeW,homeH);
    for(var i=0;i<homeStars.length;i++){
        var s=homeStars[i];
        s.y+=s.v*s.z;
        if(s.y>homeH+2){s.y=-2;s.x=Math.random()*homeW}
        var a=0.25+s.z/2.5*0.75,p=Math.floor(170+s.z*35);
        homeCtx.fillStyle='rgba('+p+',110,'+(p+40)+','+a+')';
        homeCtx.beginPath();homeCtx.arc(s.x,s.y,s.r*s.z,0,Math.PI*2);homeCtx.fill();
        if(s.r>1.1){homeCtx.shadowBlur=8;homeCtx.shadowColor='#c77dff';homeCtx.fill();homeCtx.shadowBlur=0}
    }
    homeAnimId=requestAnimationFrame(drawStars);
}
function startStarfield(){if(state.starfieldRunning)return;state.starfieldRunning=true;homeCtx=homeCanvas.getContext('2d');resizeHomeCanvas();if(homeAnimId)cancelAnimationFrame(homeAnimId);drawStars()}

function renderHomeTabs(){
    homeGamesRow.innerHTML='';
    GAMES.forEach(function(g){
        var b=document.createElement('div');
        b.className='game-tab';
        b.textContent=g.name;
        b.addEventListener('click',function(){openGame(g)});
        homeGamesRow.appendChild(b);
    });
}

function makeBlobUrl(html){
    var blob=new Blob([html],{type:'text/html;charset=utf-8'});
    return URL.createObjectURL(blob);
}

function prepareViewer(label){
    viewer.classList.add('visible');
    viewerLoading.style.display='flex';
    viewerLoadingText.textContent='Loading '+label+'...';
    viewerLoadingSub.textContent='Preparing...';
    viewerFrame.onload=null;
    viewerFrame.onerror=null;
    viewerFrame.removeAttribute('srcdoc');
    viewerFrame.src='about:blank';
    if(state.currentBlob){try{URL.revokeObjectURL(state.currentBlob)}catch(e){}state.currentBlob=null}
}

function openGame(game){
    prepareViewer(game.name);

    if(game.type==='url'){
        state.currentType='url';
        viewerLoadingSub.textContent='Connecting...';
        var urlSettled=false;
        var urlTimer=setTimeout(function(){
            if(urlSettled)return;urlSettled=true;
            viewerLoadingSub.textContent='Still loading...';
        },15000);
        viewerFrame.onload=function(){
            if(urlSettled)return;urlSettled=true;
            clearTimeout(urlTimer);
            viewerLoadingSub.textContent='Loaded.';
            setTimeout(function(){viewerLoading.style.display='none'},300);
        };
        viewerFrame.src='about:blank';
        setTimeout(function(){viewerFrame.src=game.url},30);
        return;
    }

    state.currentType='html';
    var ta=document.getElementById(game.id);
    if(!ta){viewerLoadingText.textContent='Missing: '+game.id;viewerLoadingSub.textContent='No textarea.';return}
    var html=ta.value;
    if(!html||html.length<20){viewerLoadingText.textContent='Empty: '+game.name;viewerLoadingSub.textContent='Textarea blank.';return}
    viewerLoadingSub.textContent='Rendering ('+Math.round(html.length/1024)+' KB)...';
    var blobUrl;
    try{blobUrl=makeBlobUrl(html);state.currentBlob=blobUrl}
    catch(e){viewerLoadingText.textContent='Blob failed.';viewerLoadingSub.textContent=e.message;return}
    var done=false;
    function finish(){
        if(done)return;done=true;
        viewerLoadingSub.textContent='Loaded.';
        setTimeout(function(){viewerLoading.style.display='none'},500);
    }
    viewerFrame.onload=function(){finish()};
    viewerFrame.src=blobUrl;
    setTimeout(finish,5000);
}

/* Search bar opens results in the same viewer. Uses DuckDuckGo HTML
   as the default search engine. Direct URLs load as-is. */
function openSearch(raw){
    var url=(raw||'').trim();
    if(!url)return;
    var isUrl=/^https?:\/\//i.test(url);
    var isDomain=/^[^\s]+\.[^\s]+$/.test(url)&&url.indexOf(' ')===-1;
    if(!isUrl){
        if(isDomain)url='https://'+url;
        else url='https://html.duckduckgo.com/html/?q='+encodeURIComponent(url);
    }
    prepareViewer(url);
    state.currentType='url';
    viewerLoadingSub.textContent='Connecting...';
    var settled=false;
    var timer=setTimeout(function(){
        if(settled)return;settled=true;
        viewerLoadingSub.textContent='Still loading...';
    },15000);
    viewerFrame.onload=function(){
        if(settled)return;settled=true;
        clearTimeout(timer);
        viewerLoadingSub.textContent='Loaded.';
        setTimeout(function(){viewerLoading.style.display='none'},300);
    };
    viewerFrame.src='about:blank';
    setTimeout(function(){viewerFrame.src=url},30);
}

function closeViewer(){
    try{
        if(document.fullscreenElement)document.exitFullscreen();
        else if(document.webkitFullscreenElement)document.webkitExitFullscreen();
        else if(document.msFullscreenElement)document.msExitFullscreen();
    }catch(e){}
    viewer.classList.remove('visible');
    viewerFrame.removeAttribute('srcdoc');
    viewerFrame.src='about:blank';
    if(state.currentBlob){try{URL.revokeObjectURL(state.currentBlob)}catch(e){}state.currentBlob=null}
}

function fullscreenViewer(){
    var el=viewer;
    try{
        if(el.requestFullscreen)el.requestFullscreen();
        else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
        else if(el.msRequestFullscreen)el.msRequestFullscreen();
    }catch(e){}
    setTimeout(function(){
        try{if(viewerFrame&&viewerFrame.contentWindow)viewerFrame.contentWindow.dispatchEvent(new Event('resize'))}catch(e){}
    },250);
}

function bindEvents(){
    launchBtn.addEventListener('click',launchPortal);
    searchGo.addEventListener('click',function(){openSearch(searchInput.value)});
    searchInput.addEventListener('keydown',function(e){
        if(e.key==='Enter'){e.preventDefault();openSearch(searchInput.value)}
    });
    viewerExit.addEventListener('click',closeViewer);
    viewerFull.addEventListener('click',fullscreenViewer);
    window.addEventListener('resize',resizeHomeCanvas);
    document.addEventListener('keydown',function(e){
        if(e.key==='Escape'&&viewer.classList.contains('visible'))closeViewer();
    });
}

function init(){
    bindEvents();
    renderHomeTabs();
    startStarfield();
    if(window.__NEXUS_LAUNCHED__===true){launcher.style.display='none';app.classList.add('visible');startHeartbeat(window)}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();

})();
</script>
